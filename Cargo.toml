[package]
name = "dreamland"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "bevy_anti_alias",
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_light",
  "bevy_log",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_post_process",
  "bevy_render",
  "bevy_scene",
  "bevy_shader",
  "bevy_window",
  "bevy_winit",
  "free_camera",
  "multi_threaded",
  "std",
  "webgpu",
] }
bytemuck = "1"
log = { version = "*", features = ["release_max_level_off"] }
tokio = { version = "1.53", features = ["sync"] }
wasm-bindgen = "0.2.129"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"

[profile.dev]
opt-level = 1
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3
