[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
avian3d = "0.4.0"
bevy = { version = "0.17", default-features = false, features = [
  "bevy_anti_alias",
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_light",
  "bevy_log",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_post_process",
  "bevy_render",
  "bevy_scene",
  "bevy_shader",
  "bevy_window",
  "bevy_winit",
  "debug",
  "multi_threaded",
  "std",
  "webgpu",
] }
bevy-tnua = "0.26.0"
bevy-tnua-avian3d = "0.7.1"
bytemuck = "1.24.0"
once_cell = "1.21.3"
tokio = { version = "1.48.0", features = ["sync"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.55"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"

[profile.dev]
opt-level = 1
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3
