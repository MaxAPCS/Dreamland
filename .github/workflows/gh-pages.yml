# Workflow for building and deploying a site to GitHub Pages
name: Deploy with GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env: 
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.1
      - name: Setup Rust
        run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - name: Setup wasm-bindgen
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: '0.2.105'
      - name: Build Project
        run: cargo build --verbose --release --target wasm32-unknown-unknown
      - name: Bind Project
        run: wasm-bindgen --out-dir _site --target web target/wasm32-unknown-unknown/release/portfolio.wasm && cp serve/* _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          retention-days: 3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
