name: Run wasm-bindgen-test Tests
on: [push]

env: 
  CARGO_TERM_COLOR: always
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/setup-env
      - name: Run Tests
        run: cargo --config target.wasm32-unknown-unknown.runner=\"wasm-bindgen-test-runner\" test