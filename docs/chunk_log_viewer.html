<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunk Log Visualizer</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --axis-color: #666666;
            --grid-color: #eeeeee;
            --input-bg: #f8f8f8;
            --input-border: #cccccc;
            --card-bg: #f9f9f9;
            --active-filter: #4a90e2;
            --animation-color: #ff5722;
        }

        [data-theme="dark"] {
            --bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --axis-color: #aaaaaa;
            --grid-color: #333333;
            --input-bg: #2d2d2d;
            --input-border: #555555;
            --card-bg: #252525;
            --active-filter: #64a8ff;
            --animation-color: #ff8a65;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.5;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--axis-color);
        }

        .canvas-container {
            position: relative;
            border: 1px solid var(--axis-color);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--card-bg);
        }

        canvas {
            display: block;
            width: 100%;
            height: 500px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }

        .input-section,
        .legends {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--axis-color);
        }

        .input-section h3,
        .legends h3 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            border: 1px solid var(--axis-color);
            transition: all 0.2s;
        }

        .legend-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .legend-item.hidden {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .legend-item.active {
            border-color: var(--active-filter);
            box-shadow: 0 0 0 2px var(--active-filter);
        }

        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .type-color-box {
            border: 2px solid;
        }

        button {
            background-color: var(--axis-color);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .sample-logs {
            font-family: monospace;
            background-color: var(--input-bg);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid var(--input-border);
        }

        .info {
            font-size: 14px;
            color: var(--axis-color);
            margin-top: 5px;
        }

        .coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }

        .filter-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .filter-btn {
            padding: 5px 10px;
            font-size: 12px;
        }

        .animation-controls {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--axis-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .animation-control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .animation-control-group label {
            font-weight: bold;
            white-space: nowrap;
        }

        .animation-control-group input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 60px;
        }

        .animation-btn {
            background-color: var(--animation-color);
            color: white;
        }

        .animation-btn.pause {
            background-color: #ff9800;
        }

        .animation-btn.stop {
            background-color: #f44336;
        }

        .animation-progress {
            flex-grow: 1;
            height: 8px;
            background-color: var(--grid-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .animation-progress-bar {
            height: 100%;
            background-color: var(--animation-color);
            width: 0%;
            transition: width 0.3s;
        }

        .animation-status {
            font-size: 14px;
            font-weight: bold;
        }

        .current-log {
            font-family: monospace;
            background-color: var(--input-bg);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            border-left: 3px solid var(--animation-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Chunk Log Visualizer</h1>
            <button id="themeToggle">Toggle Dark Mode</button>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            <div class="coordinates" id="coordinates">(0, 0)</div>
        </div>

        <div class="animation-controls">
            <div class="animation-control-group">
                <label for="animationSpeed">Speed (ms):</label>
                <input type="number" id="animationSpeed" min="50" max="5000" value="500">
            </div>
            <div class="animation-control-group">
                <label for="animationWindow">Window Size:</label>
                <input type="number" id="animationWindow" min="1" max="50" value="5">
            </div>
            <button id="animationPlay" class="animation-btn">Play</button>
            <button id="animationPause" class="animation-btn pause" style="display: none;">Pause</button>
            <button id="animationStop" class="animation-btn stop">Stop</button>
            <div class="animation-progress">
                <div class="animation-progress-bar" id="animationProgress"></div>
            </div>
            <div class="animation-status" id="animationStatus">Stopped</div>
        </div>

        <div id="currentLogDisplay" class="current-log" style="display: none;">
            Current log: <span id="currentLogText"></span>
        </div>

        <div class="controls">
            <div class="input-section">
                <h3>Input Logs</h3>
                <textarea id="logInput" placeholder="Paste your chunk logs here...">DEBUG app: src/world.rs:128 LINKD (  0,  -4) 2x2 L
DEBUG app: src/world.rs:109 GENER ( -8,   0) 4x4 L
DEBUG app: src/quadtree.rs:155 SUBDV ( -8,  -8) 16x16 L
DEBUG app: src/world.rs:130 LINKD (  2,  -4) 2x2 L
DEBUG app: src/world.rs:115 GENER ( -4,   0) 4x4 L
DEBUG app: src/quadtree.rs:160 SUBDV ( -8,   8) 16x16 L</textarea>
                <div class="info">Enter one log per line. Format: DEBUG ... IDENTIFIER (X, Y) WxH TYPE</div>
            </div>

            <div class="legends">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>Identifiers</h3>
                    <div class="filter-controls">
                        <button class="filter-btn" id="showAllIdentifiers">Show All</button>
                        <button class="filter-btn" id="hideAllIdentifiers">Hide All</button>
                    </div>
                </div>
                <div id="identifierLegend" class="legend"></div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                    <h3>Types</h3>
                    <div class="filter-controls">
                        <button class="filter-btn" id="showAllTypes">Show All</button>
                        <button class="filter-btn" id="hideAllTypes">Hide All</button>
                    </div>
                </div>
                <div id="typeLegend" class="legend"></div>
            </div>
        </div>
    </div>

    <script>
        // Parse logs into structured data
        function parseLogs(logs) {
            return logs.map((log, index) => {
                // Extract identifier, coordinates, dimensions, and type
                const match = log.match(/(\w+)\s+\(\s*(-?\d+),\s*(-?\d+)\)\s*(\d+)x(\d+)\s+(\w)/);
                if (!match) return null;

                return {
                    identifier: match[1],
                    x: parseInt(match[2]),
                    y: parseInt(match[3]),
                    width: parseInt(match[4]),
                    height: parseInt(match[5]),
                    type: match[6],
                    originalLog: log,
                    index: index
                };
            }).filter(Boolean);
        }

        // Generate colors for identifiers and types
        function generateColors(count, isStroke = false) {
            const colors = [];
            const hueStep = 360 / Math.max(count, 1);
            const saturation = isStroke ? 80 : 60;
            const lightness = isStroke ? 50 : 70;
            const alpha = isStroke ? 0.8 : 0.5;

            for (let i = 0; i < count; i++) {
                const hue = (i * hueStep) % 360;
                colors.push(`hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`);
            }

            return colors;
        }

        // Initialize visualization
        function initVisualization() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const coordinatesDisplay = document.getElementById('coordinates');

            // Hidden state for identifiers and types
            const hiddenIdentifiers = new Set();
            const hiddenTypes = new Set();

            // Animation state
            let animationState = {
                isPlaying: false,
                isPaused: false,
                currentIndex: 0,
                speed: 500,
                windowSize: 5,
                intervalId: null,
                logs: [],
                filteredLogs: []
            };

            // Set canvas size
            function setCanvasSize() {
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                return rect;
            }

            let rect = setCanvasSize();

            // Get filtered logs based on current filter settings
            function getFilteredLogs(logs) {
                return logs.filter(log =>
                    !hiddenIdentifiers.has(log.identifier) &&
                    !hiddenTypes.has(log.type)
                );
            }

            // Draw function
            function draw(animationMode = false) {
                const logsText = document.getElementById('logInput').value;
                const logs = logsText.split('\n').filter(line => line.trim() !== '');
                const parsedLogs = parseLogs(logs);

                // Update animation logs if needed
                if (!animationMode) {
                    animationState.logs = parsedLogs;
                    animationState.filteredLogs = getFilteredLogs(parsedLogs);
                }

                // Clear canvas
                ctx.clearRect(0, 0, rect.width, rect.height);

                // If no logs, show message
                if (parsedLogs.length === 0) {
                    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-color');
                    ctx.font = '16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('No valid logs to display', rect.width / 2, rect.height / 2);
                    return;
                }

                // Get unique identifiers and types from all logs
                const identifiers = [...new Set(parsedLogs.map(log => log.identifier))];
                const types = [...new Set(parsedLogs.map(log => log.type))];

                // Generate colors
                const identifierColors = generateColors(identifiers.length);
                const typeColors = generateColors(types.length, true);

                // Create color maps
                const identifierColorMap = {};
                identifiers.forEach((id, i) => {
                    identifierColorMap[id] = identifierColors[i];
                });

                const typeColorMap = {};
                types.forEach((type, i) => {
                    typeColorMap[type] = typeColors[i];
                });

                // Calculate bounds for zoom-to-fit (using all logs)
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

                parsedLogs.forEach(log => {
                    minX = Math.min(minX, log.x);
                    minY = Math.min(minY, log.y);
                    maxX = Math.max(maxX, log.x + log.width);
                    maxY = Math.max(maxY, log.y + log.height);
                });

                // Add some padding
                const padding = 2;
                minX -= padding;
                minY -= padding;
                maxX += padding;
                maxY += padding;

                // Calculate scaling and translation
                const scaleX = rect.width / (maxX - minX);
                const scaleY = rect.height / (maxY - minY);
                const scale = Math.min(scaleX, scaleY);

                const offsetX = -minX * scale;
                const offsetY = rect.height + minY * scale; // Flip Y axis

                // Draw grid
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-color');
                ctx.lineWidth = 1;

                const gridSize = Math.pow(2, Math.ceil(Math.log2(20 / scale))); // Adaptive grid size
                const gridStep = gridSize * scale;

                // Vertical grid lines
                for (let x = Math.ceil(minX / gridSize) * gridSize; x <= maxX; x += gridSize) {
                    const screenX = x * scale + offsetX;
                    ctx.beginPath();
                    ctx.moveTo(screenX, 0);
                    ctx.lineTo(screenX, rect.height);
                    ctx.stroke();
                }

                // Horizontal grid lines
                for (let y = Math.ceil(minY / gridSize) * gridSize; y <= maxY; y += gridSize) {
                    const screenY = offsetY - y * scale;
                    ctx.beginPath();
                    ctx.moveTo(0, screenY);
                    ctx.lineTo(rect.width, screenY);
                    ctx.stroke();
                }

                // Draw axes
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--axis-color');
                ctx.lineWidth = 2;

                // X axis
                if (minY <= 0 && maxY >= 0) {
                    const y = offsetY;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(rect.width, y);
                    ctx.stroke();
                }

                // Y axis
                if (minX <= 0 && maxX >= 0) {
                    const x = offsetX;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, rect.height);
                    ctx.stroke();
                }

                // Determine which logs to draw
                let logsToDraw = parsedLogs;

                if (animationMode && animationState.isPlaying && !animationState.isPaused) {
                    // In animation mode, only draw filtered logs within the current window
                    const startIndex = Math.max(0, animationState.currentIndex - animationState.windowSize + 1);
                    logsToDraw = animationState.filteredLogs.slice(startIndex, animationState.currentIndex + 1);

                    // Highlight the most recent log
                    if (logsToDraw.length > 0) {
                        const currentLog = logsToDraw[logsToDraw.length - 1];

                        // Draw a highlight around the current log
                        const screenX = currentLog.x * scale + offsetX;
                        const screenY = offsetY - (currentLog.y + currentLog.height) * scale;
                        const screenWidth = currentLog.width * scale;
                        const screenHeight = currentLog.height * scale;

                        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--animation-color');
                        ctx.lineWidth = 3;
                        ctx.setLineDash([5, 5]);
                        ctx.strokeRect(screenX - 2, screenY - 2, screenWidth + 4, screenHeight + 4);
                        ctx.setLineDash([]);

                        // Update current log display
                        document.getElementById('currentLogText').textContent = currentLog.originalLog;
                        document.getElementById('currentLogDisplay').style.display = 'block';
                    }
                } else {
                    // In non-animation mode, apply filters to all logs
                    logsToDraw = getFilteredLogs(parsedLogs);
                }

                // Draw rectangles
                logsToDraw.forEach(log => {
                    const screenX = log.x * scale + offsetX;
                    const screenY = offsetY - (log.y + log.height) * scale; // Flip Y axis
                    const screenWidth = log.width * scale;
                    const screenHeight = log.height * scale;

                    // Draw fill
                    ctx.fillStyle = identifierColorMap[log.identifier];
                    ctx.fillRect(screenX, screenY, screenWidth, screenHeight);

                    // Draw stroke
                    ctx.strokeStyle = typeColorMap[log.type];
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX, screenY, screenWidth, screenHeight);
                });

                // Update legends
                updateLegends(identifiers, types, identifierColorMap, typeColorMap);
            }

            // Create/update legends
            function updateLegends(identifiers, types, identifierColorMap, typeColorMap) {
                const identifierLegend = document.getElementById('identifierLegend');
                const typeLegend = document.getElementById('typeLegend');

                // Clear existing legends
                identifierLegend.innerHTML = '';
                typeLegend.innerHTML = '';

                // Identifier legend
                identifiers.forEach((id, i) => {
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    item.dataset.identifier = id;

                    if (hiddenIdentifiers.has(id)) {
                        item.classList.add('hidden');
                    } else {
                        item.classList.add('active');
                    }

                    const colorBox = document.createElement('div');
                    colorBox.className = 'color-box';
                    colorBox.style.backgroundColor = identifierColorMap[id];

                    const label = document.createElement('span');
                    label.textContent = id;

                    item.appendChild(colorBox);
                    item.appendChild(label);

                    item.addEventListener('click', () => {
                        if (hiddenIdentifiers.has(id)) {
                            hiddenIdentifiers.delete(id);
                            item.classList.remove('hidden');
                            item.classList.add('active');
                        } else {
                            hiddenIdentifiers.add(id);
                            item.classList.add('hidden');
                            item.classList.remove('active');
                        }

                        // Update filtered logs for animation
                        if (animationState.isPlaying) {
                            animationState.filteredLogs = getFilteredLogs(animationState.logs);

                            // Adjust current index if needed
                            if (animationState.currentIndex >= animationState.filteredLogs.length) {
                                animationState.currentIndex = Math.max(0, animationState.filteredLogs.length - 1);
                                updateAnimationProgress();
                            }
                        }

                        draw(animationState.isPlaying && !animationState.isPaused);
                    });

                    identifierLegend.appendChild(item);
                });

                // Type legend
                types.forEach((type, i) => {
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    item.dataset.type = type;

                    if (hiddenTypes.has(type)) {
                        item.classList.add('hidden');
                    } else {
                        item.classList.add('active');
                    }

                    const colorBox = document.createElement('div');
                    colorBox.className = 'color-box type-color-box';
                    colorBox.style.borderColor = typeColorMap[type];

                    const label = document.createElement('span');
                    label.textContent = type;

                    item.appendChild(colorBox);
                    item.appendChild(label);

                    item.addEventListener('click', () => {
                        if (hiddenTypes.has(type)) {
                            hiddenTypes.delete(type);
                            item.classList.remove('hidden');
                            item.classList.add('active');
                        } else {
                            hiddenTypes.add(type);
                            item.classList.add('hidden');
                            item.classList.remove('active');
                        }

                        // Update filtered logs for animation
                        if (animationState.isPlaying) {
                            animationState.filteredLogs = getFilteredLogs(animationState.logs);

                            // Adjust current index if needed
                            if (animationState.currentIndex >= animationState.filteredLogs.length) {
                                animationState.currentIndex = Math.max(0, animationState.filteredLogs.length - 1);
                                updateAnimationProgress();
                            }
                        }

                        draw(animationState.isPlaying && !animationState.isPaused);
                    });

                    typeLegend.appendChild(item);
                });
            }

            // Animation functions
            function startAnimation() {
                const logsText = document.getElementById('logInput').value;
                const logs = logsText.split('\n').filter(line => line.trim() !== '');
                animationState.logs = parseLogs(logs);
                animationState.filteredLogs = getFilteredLogs(animationState.logs);

                if (animationState.filteredLogs.length === 0) {
                    alert('No logs match the current filter settings');
                    return;
                }

                animationState.isPlaying = true;
                animationState.isPaused = false;
                animationState.currentIndex = 0;
                animationState.speed = parseInt(document.getElementById('animationSpeed').value);
                animationState.windowSize = parseInt(document.getElementById('animationWindow').value);

                document.getElementById('animationPlay').style.display = 'none';
                document.getElementById('animationPause').style.display = 'inline-block';
                document.getElementById('animationStatus').textContent = 'Playing';

                // Start the animation interval
                animationState.intervalId = setInterval(() => {
                    if (animationState.currentIndex < animationState.filteredLogs.length - 1) {
                        animationState.currentIndex++;
                        updateAnimationProgress();
                        draw(true);
                    } else {
                        stopAnimation();
                    }
                }, animationState.speed);

                updateAnimationProgress();
                draw(true);
            }

            function pauseAnimation() {
                if (animationState.isPlaying && !animationState.isPaused) {
                    animationState.isPaused = true;
                    clearInterval(animationState.intervalId);
                    document.getElementById('animationPause').style.display = 'none';
                    document.getElementById('animationPlay').style.display = 'inline-block';
                    document.getElementById('animationStatus').textContent = 'Paused';
                }
            }

            function resumeAnimation() {
                if (animationState.isPlaying && animationState.isPaused) {
                    animationState.isPaused = false;
                    document.getElementById('animationPlay').style.display = 'none';
                    document.getElementById('animationPause').style.display = 'inline-block';
                    document.getElementById('animationStatus').textContent = 'Playing';

                    // Restart the animation interval
                    animationState.intervalId = setInterval(() => {
                        if (animationState.currentIndex < animationState.filteredLogs.length - 1) {
                            animationState.currentIndex++;
                            updateAnimationProgress();
                            draw(true);
                        } else {
                            stopAnimation();
                        }
                    }, animationState.speed);
                }
            }

            function stopAnimation() {
                animationState.isPlaying = false;
                animationState.isPaused = false;
                clearInterval(animationState.intervalId);

                document.getElementById('animationPlay').style.display = 'inline-block';
                document.getElementById('animationPause').style.display = 'none';
                document.getElementById('animationStatus').textContent = 'Stopped';
                document.getElementById('currentLogDisplay').style.display = 'none';

                updateAnimationProgress();
                draw(false);
            }

            function updateAnimationProgress() {
                const progress = animationState.filteredLogs.length > 0
                    ? (animationState.currentIndex + 1) / animationState.filteredLogs.length * 100
                    : 0;
                document.getElementById('animationProgress').style.width = `${progress}%`;
            }

            // Mouse move event to show coordinates
            canvas.addEventListener('mousemove', (e) => {
                const logsText = document.getElementById('logInput').value;
                const logs = logsText.split('\n').filter(line => line.trim() !== '');
                const parsedLogs = parseLogs(logs);

                if (parsedLogs.length === 0) {
                    coordinatesDisplay.textContent = '(0, 0)';
                    return;
                }

                // Calculate bounds for zoom-to-fit
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

                parsedLogs.forEach(log => {
                    minX = Math.min(minX, log.x);
                    minY = Math.min(minY, log.y);
                    maxX = Math.max(maxX, log.x + log.width);
                    maxY = Math.max(maxY, log.y + log.height);
                });

                // Add some padding
                const padding = 2;
                minX -= padding;
                minY -= padding;
                maxX += padding;
                maxY += padding;

                // Calculate scaling and translation
                const scaleX = rect.width / (maxX - minX);
                const scaleY = rect.height / (maxY - minY);
                const scale = Math.min(scaleX, scaleY);

                const offsetX = -minX * scale;
                const offsetY = rect.height + minY * scale; // Flip Y axis

                // Convert mouse position to world coordinates
                const rectCanvas = canvas.getBoundingClientRect();
                const x = (e.clientX - rectCanvas.left) / scale - offsetX / scale;
                const y = (offsetY - (e.clientY - rectCanvas.top)) / scale; // Flip Y axis

                coordinatesDisplay.textContent = `(${Math.round(x)}, ${Math.round(y)})`;
            });

            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', () => {
                document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
                draw(animationState.isPlaying && !animationState.isPaused);
            });

            // Input change event
            document.getElementById('logInput').addEventListener('input', () => {
                // Stop animation if it's running
                if (animationState.isPlaying) {
                    stopAnimation();
                }
                draw(false);
            });

            // Filter controls
            document.getElementById('showAllIdentifiers').addEventListener('click', () => {
                const logsText = document.getElementById('logInput').value;
                const logs = logsText.split('\n').filter(line => line.trim() !== '');
                const parsedLogs = parseLogs(logs);
                const identifiers = [...new Set(parsedLogs.map(log => log.identifier))];

                identifiers.forEach(id => hiddenIdentifiers.delete(id));

                // Update filtered logs for animation
                if (animationState.isPlaying) {
                    animationState.filteredLogs = getFilteredLogs(animationState.logs);

                    // Adjust current index if needed
                    if (animationState.currentIndex >= animationState.filteredLogs.length) {
                        animationState.currentIndex = Math.max(0, animationState.filteredLogs.length - 1);
                        updateAnimationProgress();
                    }
                }

                draw(animationState.isPlaying && !animationState.isPaused);
            });

            document.getElementById('hideAllIdentifiers').addEventListener('click', () => {
                const logsText = document.getElementById('logInput').value;
                const logs = logsText.split('\n').filter(line => line.trim() !== '');
                const parsedLogs = parseLogs(logs);
                const identifiers = [...new Set(parsedLogs.map(log => log.identifier))];

                identifiers.forEach(id => hiddenIdentifiers.add(id));

                // Update filtered logs for animation
                if (animationState.isPlaying) {
                    animationState.filteredLogs = getFilteredLogs(animationState.logs);

                    // Adjust current index if needed
                    if (animationState.currentIndex >= animationState.filteredLogs.length) {
                        animationState.currentIndex = Math.max(0, animationState.filteredLogs.length - 1);
                        updateAnimationProgress();
                    }
                }

                draw(animationState.isPlaying && !animationState.isPaused);
            });

            document.getElementById('showAllTypes').addEventListener('click', () => {
                const logsText = document.getElementById('logInput').value;
                const logs = logsText.split('\n').filter(line => line.trim() !== '');
                const parsedLogs = parseLogs(logs);
                const types = [...new Set(parsedLogs.map(log => log.type))];

                types.forEach(type => hiddenTypes.delete(type));

                // Update filtered logs for animation
                if (animationState.isPlaying) {
                    animationState.filteredLogs = getFilteredLogs(animationState.logs);

                    // Adjust current index if needed
                    if (animationState.currentIndex >= animationState.filteredLogs.length) {
                        animationState.currentIndex = Math.max(0, animationState.filteredLogs.length - 1);
                        updateAnimationProgress();
                    }
                }

                draw(animationState.isPlaying && !animationState.isPaused);
            });

            document.getElementById('hideAllTypes').addEventListener('click', () => {
                const logsText = document.getElementById('logInput').value;
                const logs = logsText.split('\n').filter(line => line.trim() !== '');
                const parsedLogs = parseLogs(logs);
                const types = [...new Set(parsedLogs.map(log => log.type))];

                types.forEach(type => hiddenTypes.add(type));

                // Update filtered logs for animation
                if (animationState.isPlaying) {
                    animationState.filteredLogs = getFilteredLogs(animationState.logs);

                    // Adjust current index if needed
                    if (animationState.currentIndex >= animationState.filteredLogs.length) {
                        animationState.currentIndex = Math.max(0, animationState.filteredLogs.length - 1);
                        updateAnimationProgress();
                    }
                }

                draw(animationState.isPlaying && !animationState.isPaused);
            });

            // Animation controls
            document.getElementById('animationPlay').addEventListener('click', () => {
                if (animationState.isPlaying && animationState.isPaused) {
                    resumeAnimation();
                } else {
                    startAnimation();
                }
            });

            document.getElementById('animationPause').addEventListener('click', pauseAnimation);
            document.getElementById('animationStop').addEventListener('click', stopAnimation);

            // Initialize
            draw(false);

            // Handle window resize
            window.addEventListener('resize', () => {
                rect = setCanvasSize();
                draw(animationState.isPlaying && !animationState.isPaused);
            });
        }

        // Initialize when the page loads
        window.addEventListener('load', initVisualization);
    </script>
</body>

</html>
